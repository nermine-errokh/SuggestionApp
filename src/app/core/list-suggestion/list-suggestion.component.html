<div class="container">

  <input
    type="text"
    class="search"
    placeholder="🔍 Rechercher par titre ou catégorie"
    [(ngModel)]="searchText"
  />

  <div class="card" *ngFor="let s of filteredSuggestions()">

    <h3>{{ s.title }}</h3>
    <span class="category">{{ s.category }}</span>

    <p class="description">{{ s.description }}</p>

    <div class="info">
      <span>📅 {{ s.date | date:'dd/MM/yyyy' }}</span>
      <span>👍 {{ s.nbLikes }}</span>
    </div>

    <div class="actions" *ngIf="s.status !== 'refusee'">
      <button class="like" (click)="likeSuggestion(s)">Like</button>
      <button class="fav" (click)="addToFavorites(s)">Favoris</button>
    </div>

    <div class="status refusee" *ngIf="s.status === 'refusee'">
      ❌ Suggestion refusée
    </div>

  </div>

<!-- ================= FAVORIS ================= -->

<div class="favorites" *ngIf="favorites.length > 0">

  <h2>⭐ Suggestions favorites</h2>

  <div class="card favorite-card" *ngFor="let f of favorites">

    <h3>{{ f.title }}</h3>
    <span class="category">{{ f.category }}</span>

    <p class="description">{{ f.description }}</p>

    <div class="info">
      <span>📅 {{ f.date | date:'dd/MM/yyyy' }}</span>
      <span>👍 {{ f.nbLikes }}</span>
    </div>

  </div>

</div>
</div>
